services:
  db:
    image: ankane/pgvector:latest  
    container_name: agentic_db
    restart: always
    environment:
      POSTGRES_USER: chinnapong
      POSTGRES_PASSWORD: rakmai
      POSTGRES_DB: sentinellog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinnapong -d sentinellog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: