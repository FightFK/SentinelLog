services:

  # ─── PostgreSQL + pgvector ────────────────────────────────────────
  db:
    image: ankane/pgvector:latest
    container_name: sentinellog_db
    restart: always
    environment:
      POSTGRES_USER: chinnapong
      POSTGRES_PASSWORD: rakmai
      POSTGRES_DB: sentinellog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinnapong -d sentinellog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── SentinelLog Backend (Node.js) ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinellog_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL ให้ชี้ไปที่ container db แทน localhost
      DATABASE_URL: "postgresql://chinnapong:rakmai@db:5432/sentinellog"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ─── SentinelLog Agent (Python) ──────────────────────────────────
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile.agent
    container_name: sentinellog_agent
    restart: always
    env_file:
      - ./agent/.env
    environment:
      # network_mode: host → backend อยู่ที่ localhost:3000 ของ host
      BACKEND_URL: "http://localhost:3000"
    depends_on:
      backend:
        condition: service_healthy
    # Mount nginx logs จาก host เข้า container (read-only)
    volumes:
      - /var/log/nginx:/var/log/nginx:ro
    # ต้องการ NET_ADMIN + SYS_ADMIN เพื่อ iptables บน host network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # ใช้ network namespace ของ host เพื่อให้ iptables กระทบ host จริง
    network_mode: host

volumes:
  pgdata: